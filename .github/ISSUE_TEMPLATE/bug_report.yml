name: Bug report
description: Report a reproducible problem in dsh-docling.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove credentials and sensitive document content before submitting."
  - type: input
    id: version
    attributes:
      label: dsh-docling version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node, pnpm, DSH, OS, Xberg runtime, and Tesseract language-pack versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
