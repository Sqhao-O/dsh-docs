name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Runtime-backed tests skip on Linux, so the coverage gate lives in the
      # Windows job below where the full suite runs against the real runtime.
      - run: pnpm test:nocov
      - run: pnpm build

  windows-offline-ocr:
    name: Windows offline Python/OCR runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .\scripts\build-runtime-win32-x64.mjs
      - run: node .\scripts\verify-runtime-win32-x64.mjs
      # Full suite with the coverage gate: the freshly built runtime lets the
      # Python stdio and OCR integration tests run unskipped.
      - run: pnpm test
        env:
          DSH_DOC_TEST_PYTHON: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/python/python.exe
          DSH_DOC_TEST_WORKER: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/python/worker.py
          DSH_DOC_TEST_TESSDATA: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/ocr/tessdata
      - run: pnpm build
