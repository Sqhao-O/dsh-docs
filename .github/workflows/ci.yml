name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-offline-ocr:
    name: Windows offline Python/OCR runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pwsh -NoProfile -File .\scripts\build-runtime-win32-x64.ps1
      - run: pwsh -NoProfile -File .\scripts\verify-runtime-win32-x64.ps1
      - run: pnpm test:integration
        env:
          DSH_DOC_TEST_PYTHON: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/python/python.exe
          DSH_DOC_TEST_WORKER: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/python/worker.py
          DSH_DOC_TEST_TESSDATA: ${{ github.workspace }}/.dsh-runtime/runtime-win32-x64/ocr/tessdata
      - run: pnpm build
